<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Hero Tracker" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a1a2e" />
    <title>Hero Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap" rel="stylesheet" />
    <style>
      /* Splash styles inlined so they apply on the very first paint,
         before main.tsx (and src/index.css) finish loading. */
      html, body { margin: 0; padding: 0; height: 100%; background-color: #000; }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background-color: #000;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 0.4s ease-out;
      }
      #splash.splash-hidden {
        opacity: 0;
        pointer-events: none;
      }
      #splash-logo {
        width: min(60vw, 320px);
        height: auto;
        user-select: none;
        -webkit-user-drag: none;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash" aria-hidden="true">
      <img id="splash-logo" src="/Logo_Gold.png" alt="" draggable="false" />
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
