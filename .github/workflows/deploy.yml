name: Deploy to GitHub Pages

# GitHub Pages (workflow build type) publishes a single artifact that
# replaces the *entire* site on every deploy, so this job always rebuilds
# both master (served at "/") and dev (served at "/dev/") and assembles them
# into one artifact — otherwise whichever branch triggered the run would
# wipe out the other environment.
on:
  push:
    branches: [master, dev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout master (production)
        uses: actions/checkout@v4
        with:
          ref: master
          path: prod

      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Install production dependencies
        working-directory: prod
        run: pnpm install --frozen-lockfile

      - name: Lint production
        working-directory: prod
        run: pnpm lint

      - name: Test production
        working-directory: prod
        run: pnpm test:run

      - name: Build production
        working-directory: prod
        run: pnpm build

      - name: Install dev dependencies
        working-directory: dev
        run: pnpm install --frozen-lockfile

      - name: Lint dev
        working-directory: dev
        run: pnpm lint

      - name: Test dev
        working-directory: dev
        run: pnpm test:run

      - name: Build dev
        working-directory: dev
        run: pnpm build:dev

      - name: Assemble site (production at "/", dev at "/dev/")
        run: |
          mkdir -p site
          cp -r prod/dist/. site/
          mkdir -p site/dev
          cp -r dev/dist/. site/dev/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
